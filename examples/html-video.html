<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>framv — Pure HTML Video</title>
  <style>
    body { margin: 0; background: #0d0d0d; }
    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.1); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateX(0); }
      50%      { transform: translateX(100px); }
    }
  </style>
</head>
<body>

<div id="framv-root" style="width:800px;height:600px;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);background-size:200% 200%;animation:gradientShift 4s ease infinite;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;font-family:system-ui,sans-serif;border-radius:16px;overflow:hidden;position:relative">

  <!-- Glow -->
  <div style="position:absolute;width:200px;height:200px;background:radial-gradient(circle,rgba(255,121,198,.4),transparent);border-radius:50%;animation:pulse 3s ease-in-out infinite"></div>

  <!-- Title -->
  <h1 style="color:#ff79c6;font-size:64px;font-weight:800;margin:0;z-index:1;animation:slideUp 0.8s ease both">framv</h1>

  <!-- Subtitle -->
  <p style="color:rgba(255,255,255,.7);font-size:20px;margin:0;z-index:1;animation:slideUp 0.8s 0.3s ease both">Pure HTML → MP4</p>

  <!-- Bouncing dot -->
  <div style="width:12px;height:12px;background:#50fa7b;border-radius:50%;animation:bounce 2s ease-in-out infinite;z-index:1"></div>

  <!-- Tags -->
  <div style="display:flex;gap:8px;z-index:1">
    <span style="background:rgba(255,255,255,.1);color:#fff;padding:6px 14px;border-radius:20px;font-size:14px;animation:slideUp 0.8s 0.6s ease both">No SVG</span>
    <span style="background:rgba(255,255,255,.1);color:#fff;padding:6px 14px;border-radius:20px;font-size:14px;animation:slideUp 0.8s 0.8s ease both">CSS Animations</span>
    <span style="background:rgba(255,255,255,.1);color:#fff;padding:6px 14px;border-radius:20px;font-size:14px;animation:slideUp 0.8s 1s ease both">WebCodecs</span>
  </div>

  <!-- Footer -->
  <p style="position:absolute;bottom:20px;color:rgba(255,255,255,.3);font-size:13px;animation:slideUp 0.8s 1.2s ease both">github.com/framv/framv</p>
</div>

</body>
</html>
