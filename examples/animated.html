<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>framv — Animated</title>
  <style>
    body {
      margin: 0; background: #0d0d0d;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
  </style>
</head>
<body>

<svg id="framv-root" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"><animate attributeName="stop-color" values="#1a1a2e;#16213e;#0f3460;#1a1a2e" dur="3s" repeatCount="indefinite"/></stop>
      <stop offset="100%" style="stop-color:#e94560"><animate attributeName="stop-color" values="#e94560;#533483;#e94560" dur="3s" repeatCount="indefinite"/></stop>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <text x="400" y="260" text-anchor="middle" fill="white" font-family="system-ui" font-size="48" font-weight="800">
    framv
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="320" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="system-ui" font-size="20">
    SVG SMIL animation exported to MP4
  </text>
  <circle cx="400" cy="450" r="8" fill="#ff79c6">
    <animate attributeName="cx" values="200;600;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>

</body>
</html>
