<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>framv — Sheet Demo</title>
  <style>
    body { margin:0; background:#f5f5f5; padding:40px; font-family:system-ui }

</head>
<body>

      </tr>
    </thead>
    <tbody>
      <tr><td style="border:1px solid #ddd;padding:8px 16px">Widget A</td><td style="border:1px solid #ddd;padding:8px 16px;text-align:right">12,400</td><td style="border:1px solid #ddd;padding:8px 16px;text-align:right">15,200</td><td style="border:1px solid #ddd;padding:8px 16px;text-align:right">18,900</td><td style="border:1px solid #ddd;padding:8px 16px;text-align:right">22,100</td><td style="border:1px solid #ddd;padding:8px 16px;text-align:right;font-weight:600">68,600</td></tr>

        <td style="border:1px solid #ddd;padding:10px 16px">TOTAL</td>
        <td style="border:1px solid #ddd;padding:10px 16px;text-align:right">26,900</td>
        <td style="border:1px solid #ddd;padding:10px 16px;text-align:right">31,000</td>
        <td style="border:1px solid #ddd;padding:10px 16px;text-align:right">33,800</td>
