name: Publish Libraries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Libraries
        run: npm run build

      - name: Publish to NPM
        run: |
          for pkg in core video docs slides sheet image canvas headless; do
            npm publish -w packages/$pkg --access public || echo "  (skipped @framv/$pkg — already published)"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
